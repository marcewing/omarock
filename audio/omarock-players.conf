# omarock's players stay on the bus (PipeWire client config), for
# ~/.config/pipewire/client.conf.d/: native PipeWire programs read it when
# they make their streams, as mpd and Spotify's Soloist do.
#
# mpd (its pipewire output, `target "omarock"` in mpd.conf, so its stream is
# mpd.<output name>) and Soloist (`--pipewire-device omarock`, its stream
# "spotify") play into the omarock bus (omarock-bus.conf). If the bus is
# missing they wait, silent, rather than falling back to the default output
# (linger: without it WirePlumber fails the stream instead), and a mixer
# can't move them off it. Their own volumes stay at full: omarock's one
# volume is the bus's, so WirePlumber mustn't restore an old stream volume
# (or an old target). Matched by stream name: the Spotify desktop app, if it
# were ever run, doesn't aim at the bus.
stream.rules = [
  {
    matches = [
      { node.name = "~^mpd[.].*" }
      { node.name = "spotify", target.object = "omarock" }
    ]
    actions = {
      update-props = {
        node.dont-fallback = true
        node.linger = true
        node.dont-move = true
        state.restore-props = false
        state.restore-target = false
      }
    }
  }
]
