# omarock's audio bus: a small PipeWire process of its own (as PipeWire's own
# filter-chain.service runs), started by omarock-bus.service:
#     pipewire -c ~/.local/share/omarock/audio/omarock-bus.conf
# (installed from a commit by tools/install-audio, never the working tree).
# Being its own process, it starts and stops without restarting PipeWire,
# which would interrupt every other program's audio too.
#
# All of omarock's sound goes into one virtual output, "omarock": mpd's, and
# Spotify's Soloist. The bus plays into one real device, pinned here, and
# never anywhere else. If that device goes away, the bus falls silent rather
# than falling back to the default output, and nothing can move it
# (omarock-guard cuts links made by hand). That matters on a machine with
# outputs that must never carry music, such as a radio transmitter's audio
# interface: music there could go out over the air. tools/install-audio puts
# your speakers' output here (`pactl list sinks short`, second column).
#
# The bus's volume is omarock's one volume for every source. The bus ranks
# below every real output (priority.session -500), and above outputs ranked
# lower still, such as radio interfaces ranked at -1000. An output nobody
# ranked counts as 0 and outranks it. Either way the bus's own output is
# pinned, so it never reaches a radio.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-loopback
      args = {
        node.description = "omarock"
        capture.props = {
          node.name = "omarock"
          node.description = "omarock"
          media.class = "Audio/Sink"
          audio.position = [ FL FR ]
          priority.session = -500
        }
        playback.props = {
          node.name = "omarock.output"
          node.description = "omarock output"
          audio.position = [ FL FR ]
          # Your output, put here by tools/install-audio (--output NAME, kept
          # in ~/.config/omarock/audio-output). The repo's copy never runs.
          target.object = "@OUTPUT@"
          # With the card missing, WirePlumber waits for it (linger) instead
          # of failing the stream, which would unload the whole bus.
          node.dont-fallback = true
          node.linger = true
          node.dont-move = true
          node.passive = true
          stream.dont-remix = true
        }
      }
    }
]
